server:
  port: ${AI_SERVER_PORT:8088}

spring:
  application:
    name: platform-ai
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        enabled: ${NACOS_DISCOVERY_ENABLED:false}

platform:
  ai:
    enabled: ${AI_ENABLED:false}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-ms: ${AI_TIMEOUT_MS:8000}
    # Per-API LLM gates (ignored when AI_ENABLED/key off). Env override optional.
    features:
      search-plan: ${AI_FEATURE_SEARCH_PLAN:true}
      recommend: ${AI_FEATURE_RECOMMEND:true}
      analyze: ${AI_FEATURE_ANALYZE:true}
      session-plan: ${AI_FEATURE_SESSION_PLAN:true}

logging:
  level:
    com.platform.ai: INFO
