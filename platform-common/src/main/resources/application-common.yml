spring:
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  profiles: common

#feign配置
feign:
  client:
    config:
      # 想要调用的微服务的名称 default表示全局
      default:
        loggerLevel: basic
        requestInterceptors:
          - com.platform.common.interceptor.TokenRequestIntecepor
  httpclient:
    #让feign 使用apache httpclient发送请求，而不是默认的URLConnection
    enabled: true
    # feign的最大连接数 最优参数需要结合压测调整
    max-connections: 200
    # feign单个路径的最大连接数 最优参数需要结合压测调整
    max-connections-per-route: 50

# Prefer env JWT_SECRET / JWT_EXPIRE_SECONDS (see .env.example). Do not commit real secrets.
jwt:
  secret: ${JWT_SECRET:change-me-use-a-long-random-string}
  # 有效期，单位秒，默认2周
  expire-time-in-second: ${JWT_EXPIRE_SECONDS:1209600}

# JwtOperator reads top-level ${secret} / ${expire-time-in-second} (not jwt.*). Keep in sync.
secret: ${JWT_SECRET:change-me-use-a-long-random-string}
expire-time-in-second: ${JWT_EXPIRE_SECONDS:1209600}

mybatis-plus:
  mapper-locations: classpath*:com/platform/**/dao/**/*.xml
